<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Argus">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2170"/>
      <stop offset="1" stop-color="#0f0c2a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7ff"/>
      <stop offset=".5" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".55" stop-color="#c9c0ff"/>
      <stop offset="1" stop-color="#8b7bff"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8b7bff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="20" fill="url(#halo)"/>
  <!-- six agents around the Commander -->
  <path d="M32 13.5 L48 22.75 L48 41.25 L32 50.5 L16 41.25 L16 22.75 Z" fill="none" stroke="url(#neon)" stroke-width="2" stroke-linejoin="round" opacity=".55"/>
  <path d="M32 32 L32 13.5 M32 32 L48 41.25 M32 32 L16 41.25" stroke="url(#neon)" stroke-width="2.6" stroke-linecap="round"/>
  <g fill="url(#neon)">
    <circle cx="32" cy="13.5" r="3.6"/>
    <circle cx="48" cy="22.75" r="2.6"/>
    <circle cx="48" cy="41.25" r="3.6"/>
    <circle cx="32" cy="50.5" r="2.6"/>
    <circle cx="16" cy="41.25" r="3.6"/>
    <circle cx="16" cy="22.75" r="2.6"/>
  </g>
  <circle cx="32" cy="32" r="6.2" fill="url(#core)"/>
  <circle cx="32" cy="32" r="9.5" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.2"/>
