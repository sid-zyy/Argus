<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Argus">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b3f"/>
      <stop offset="1" stop-color="#0a0a13"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="ink" x1="16" y1="47" x2="44" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7b6cff"/>
      <stop offset="1" stop-color="#46d3f5"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="url(#edge)"/>
  <!-- an A drawn as one path that climbs, turns and lands on a single point: the cause -->
  <path d="M16.5 47 L32 17.5 L41.4 35.3" fill="none" stroke="url(#ink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="46" cy="44" r="4.6" fill="#fff"/>
</svg>
