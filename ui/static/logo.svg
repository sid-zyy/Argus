<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Argus">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b3f"/>
      <stop offset="1" stop-color="#0a0a13"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="ink" x1="13" y1="50" x2="51" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7b6cff"/>
      <stop offset="1" stop-color="#46d3f5"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8f84ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8f84ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="url(#edge)"/>
  <!-- an open lens: two lids that never quite close, and an iris like a sensor's aperture -->
  <circle cx="32" cy="32" r="14" fill="url(#glow)"/>
  <path d="M13 29 Q32 9 51 29" fill="none" stroke="url(#ink)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M51 35 Q32 55 13 35" fill="none" stroke="url(#ink)" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="8.5" fill="none" stroke="url(#ink)" stroke-width="3.5"/>
  <circle cx="32" cy="32" r="3.6" fill="#fff"/>
</svg>
